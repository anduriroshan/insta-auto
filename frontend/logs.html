<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity Logs | Instagram Creator Automator</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
        <!-- Top Navigation -->
        <header class="topbar">
            <div class="topbar-left">
                <div class="brand">
                    <div class="brand-icon">⚡</div>
                    <div>
                        <div class="brand-title">InstaAuto</div>
                        <div class="brand-subtitle">Creator Suite</div>
                    </div>
                </div>

                <nav class="nav-menu">
                    <a href="/static/dashboard.html" class="nav-link">
                        <span class="nav-icon">📊</span>
                        <span class="nav-text">Dashboard</span>
                    </a>
                    <a href="/static/rules.html" class="nav-link">
                        <span class="nav-icon">⚡</span>
                        <span class="nav-text">Automation Rules</span>
                    </a>
                    <a href="/static/logs.html" class="nav-link active">
                        <span class="nav-icon">📜</span>
                        <span class="nav-text">Activity Logs</span>
                    </a>
                    <a href="/static/settings.html" class="nav-link">
                        <span class="nav-icon">⚙️</span>
                        <span class="nav-text">Settings & Setup</span>
                    </a>
                </nav>
            </div>

            <div class="sidebar-footer">
                <div class="status-badge">
                    <div class="status-dot"></div>
                    <span id="sse-status-label">Stream Connected</span>
                </div>
                <button class="btn-logout" id="btn-logout">
                    <span>🚪</span>
                    <span>Sign Out</span>
                </button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <div class="top-header">
                <div>
                    <h1 class="page-title">Activity Logs</h1>
                    <p class="page-subtitle">Real-time audit log of all Instagram DMs, comments, and triggers</p>
                </div>
                <div class="header-actions">
                    <button class="btn btn-secondary" id="btn-refresh-logs">
                        <span>🔄</span> <span>Refresh</span>
                    </button>
                    <button class="btn btn-danger" id="btn-clear-logs">
                        <span>🗑️</span> <span>Clear History</span>
                    </button>
                </div>
            </div>

            <!-- Filter Pills -->
            <div class="filter-pills">
                <button class="filter-pill active" data-filter="">All Events</button>
                <button class="filter-pill" data-filter="dm_sent">Direct Replies</button>
                <button class="filter-pill" data-filter="private_reply_sent">Comment Replies</button>
                <button class="filter-pill" data-filter="follow_gate_blocked">Follow Gates</button>
                <button class="filter-pill" data-filter="story_mention">Story Mentions</button>
                <button class="filter-pill" data-filter="queued_released">Follow Unlocks</button>
                <button class="filter-pill" data-filter="error">Errors</button>
            </div>

            <!-- Logs Table Card -->
            <div class="card">
                <div class="data-table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Timestamp</th>
                                <th>Event Type</th>
                                <th>Instagram User</th>
                                <th>Rule</th>
                                <th>Status</th>
                                <th>Details</th>
                            </tr>
                        </thead>
                        <tbody id="logs-table-body">
                            <tr>
                                <td colspan="6" style="text-align: center; color: var(--text-muted); padding: 40px;">
                                    Loading activity logs...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>

    <script src="/static/js/app.js"></script>
    <script src="/static/js/logs.js"></script>
</body>
</html>
